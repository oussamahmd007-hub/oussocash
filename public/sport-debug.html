<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSD API Debug</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d1b2e;color:#e8eef7;margin:0;padding:16px}
h1{font-size:18px}
button{display:block;width:100%;margin:6px 0;padding:13px;border-radius:10px;border:none;
  background:#2563eb;color:#fff;font-size:15px;font-weight:700}
pre{background:#000;color:#5fd;padding:12px;border-radius:10px;overflow:auto;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:60vh}
.ep{background:#1e293b;color:#cdd}
</style></head><body>
<h1>🔧 BSD API Debug — افحص المسارات</h1>
<p>اضغط أي زر، ثم صوّر النتيجة وأرسلها.</p>
<div id="btns"></div>
<h3>النتيجة:</h3>
<pre id="out">—</pre>
<script>
const eps=['/','/matches/','/events/','/events/live/','/live/','/fixtures/',
  '/leagues/','/standings/','/odds/','/predictions/','/teams/','/players/'];
const box=document.getElementById('btns');
eps.forEach(ep=>{
  const b=document.createElement('button'); b.className='ep'; b.textContent='GET '+ep;
  b.onclick=async()=>{
    const out=document.getElementById('out'); out.textContent='... جارٍ التحميل';
    try{
      const r=await fetch('/api/sport',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({view:'debug',endpoint:ep})});
      const d=await r.json();
      out.textContent=JSON.stringify(d,null,2);
    }catch(e){ out.textContent='خطأ: '+e; }
  };
  box.appendChild(b);
});
</script></body></html>
